- tapOn:
      point: "8%,11%"
- extendedWaitUntil:
      visible: "Quên mật khẩu?"
      timeout: 30000
- runFlow:
      when:
          visible: "Open debugger to view warnings."
      commands:
        - tapOn:
              point: "94%,93%"
- tapOn: ".*Đăng ký ngay"
- extendedWaitUntil:
      visible: "Tạo tài khoản"
      timeout: 30000
- takeScreenshot: "docs/screenshots/output/latest/03-register-top"

- swipe:
      direction: UP
- takeScreenshot: "docs/screenshots/output/latest/04-register-mid"

- tapOn: "Đã có tài khoản.*Đăng nhập"
